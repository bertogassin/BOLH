name: CI - Build native artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup toolchain
        run: |
          rustup default stable

      - name: Build bolh-core (release)
        run: |
          cd crates/bolh-core
          cargo build --release

  android-cross:
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-ndk
        run: cargo install cargo-ndk || true
      - name: Build Android libs
        run: |
          cd crates/bolh-core
          cargo ndk -t aarch64-linux-android -o target/android -- cargo build --release
          cargo ndk -t armv7-linux-androideabi -o target/android -- cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: crates/bolh-core/target/android

  macos-ios:
    if: runner.os == 'macOS'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-lipo
        run: cargo install cargo-lipo || true
      - name: Build iOS universal
        run: |
          cd crates/bolh-core
          cargo lipo --release || echo "cargo-lipo not available"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: crates/bolh-core/target/universal/release || true
