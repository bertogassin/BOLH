name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: fmt
        run: go fmt ./...

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  guardian-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
      - name: Build api-gateway
        run: |
          cd guardian/services/api-gateway
          go build .
      - name: Test api-gateway
        run: |
          cd guardian/services/api-gateway
          go test -count=1 ./...

  guardian-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: guardian/client-web/package-lock.json
      - name: Install and lint client-web
        run: |
          cd guardian/client-web
          npm ci
          npm run lint
      - name: Build client-web
        run: |
          cd guardian/client-web
          npm run build

  guardian-admin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: guardian/admin/package-lock.json

      - name: Install admin dependencies
        run: |
          cd guardian/admin
          npm ci

      - name: Install Playwright browser
        run: |
          cd guardian/admin
          npx playwright install --with-deps chromium

      - name: Run admin e2e smoke
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          E2E_API_BASE: http://localhost:8080
          E2E_ADMIN_SECRET: admin-e2e-secret
          E2E_ADMIN_EMAIL: admin.e2e@guardian.local
          E2E_ADMIN_PASSWORD: AdminE2E!123
          ADMIN_SECRET: admin-e2e-secret
          JWT_SECRET: ci-jwt-secret
        run: |
          set -euo pipefail
          cd guardian/services/api-gateway
          go run . > /tmp/api-gateway.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health >/dev/null
          cd ../../admin
          npx playwright test --reporter=line

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-features
      - name: cargo audit
        run: |
          cargo install cargo-audit
          cargo audit
