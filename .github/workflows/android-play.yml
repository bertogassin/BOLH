name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - closed
          - open
          - production
      release_status:
        description: "Google Play release status"
        required: true
        default: "draft"
        type: choice
        options:
          - draft
          - completed
      release_api_base_url:
        description: "Release API base URL"
        required: true
        default: "https://api.omnixius.com"
        type: string
      release_web_app_url:
        description: "Release web app URL"
        required: true
        default: "https://app.omnixius.com/"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate required secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw "Missing secret: ANDROID_KEYSTORE_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)) { throw "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS)) { throw "Missing secret: ANDROID_KEY_ALIAS" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) { throw "Missing secret: ANDROID_KEYSTORE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)) { throw "Missing secret: ANDROID_KEY_PASSWORD" }

      - name: Prepare signing and Play credentials
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          New-Item -Path "guardian/GuardianAndroid/app/keystore" -ItemType Directory -Force | Out-Null
          New-Item -Path "guardian/GuardianAndroid/keys" -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            "guardian/GuardianAndroid/app/keystore/upload-keystore.jks",
            [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          )
          [IO.File]::WriteAllText(
            "guardian/GuardianAndroid/keys/play-service-account.json",
            $env:GOOGLE_PLAY_SERVICE_ACCOUNT_JSON,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build release bundle and APK
        working-directory: guardian/GuardianAndroid
        shell: pwsh
        run: |
          $args = @(
            ":app:bundleRelease",
            ":app:assembleRelease",
            "--project-prop", "RELEASE_STORE_FILE=app/keystore/upload-keystore.jks",
            "--project-prop", "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}",
            "--project-prop", "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
            "--project-prop", "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}",
            "--project-prop", "RELEASE_API_BASE_URL=${{ github.event.inputs.release_api_base_url }}",
            "--project-prop", "RELEASE_WEB_APP_URL=${{ github.event.inputs.release_web_app_url }}"
          )
          & .\gradlew.bat @args

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolh-release-aab
          path: guardian/GuardianAndroid/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolh-release-apk
          path: guardian/GuardianAndroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish AAB to Google Play
        working-directory: guardian/GuardianAndroid
        shell: pwsh
        run: |
          $args = @(
            ":app:publishReleaseBundle",
            "--release-status", "${{ github.event.inputs.release_status }}",
            "--project-prop", "RELEASE_STORE_FILE=app/keystore/upload-keystore.jks",
            "--project-prop", "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}",
            "--project-prop", "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}",
            "--project-prop", "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}",
            "--project-prop", "RELEASE_API_BASE_URL=${{ github.event.inputs.release_api_base_url }}",
            "--project-prop", "RELEASE_WEB_APP_URL=${{ github.event.inputs.release_web_app_url }}",
            "--project-prop", "PLAY_SERVICE_ACCOUNT_FILE=keys/play-service-account.json",
            "--project-prop", "PLAY_TRACK=${{ github.event.inputs.track }}"
          )
          & .\gradlew.bat @args
