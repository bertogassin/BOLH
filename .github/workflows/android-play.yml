name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - closed
          - open
          - production
      release_api_base_url:
        description: "Release API base URL"
        required: true
        default: "https://api.bolhsecurity.com"
        type: string
      release_web_app_url:
        description: "Release web app URL"
        required: true
        default: "https://app.bolhsecurity.com/"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate required secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")) { throw "Missing secret: ANDROID_KEYSTORE_BASE64" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}")) { throw "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEY_ALIAS }}")) { throw "Missing secret: ANDROID_KEY_ALIAS" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEYSTORE_PASSWORD }}")) { throw "Missing secret: ANDROID_KEYSTORE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ANDROID_KEY_PASSWORD }}")) { throw "Missing secret: ANDROID_KEY_PASSWORD" }

      - name: Prepare signing and Play credentials
        shell: pwsh
        run: |
          New-Item -Path "guardian/GuardianAndroid/app/keystore" -ItemType Directory -Force | Out-Null
          New-Item -Path "guardian/GuardianAndroid/keys" -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            "guardian/GuardianAndroid/app/keystore/upload-keystore.jks",
            [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          )
          Set-Content -Path "guardian/GuardianAndroid/keys/play-service-account.json" -Value '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' -NoNewline

      - name: Build release bundle
        working-directory: guardian/GuardianAndroid
        shell: pwsh
        run: |
          .\gradlew.bat :app:bundleRelease `
            -PRELEASE_STORE_FILE=app/keystore/upload-keystore.jks `
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -PRELEASE_API_BASE_URL="${{ github.event.inputs.release_api_base_url }}" `
            -PRELEASE_WEB_APP_URL="${{ github.event.inputs.release_web_app_url }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolh-release-aab
          path: guardian/GuardianAndroid/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish AAB to Google Play
        working-directory: guardian/GuardianAndroid
        shell: pwsh
        run: |
          .\gradlew.bat :app:publishReleaseBundle `
            -PRELEASE_STORE_FILE=app/keystore/upload-keystore.jks `
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -PRELEASE_API_BASE_URL="${{ github.event.inputs.release_api_base_url }}" `
            -PRELEASE_WEB_APP_URL="${{ github.event.inputs.release_web_app_url }}" `
            -PPLAY_SERVICE_ACCOUNT_FILE=keys/play-service-account.json `
            -PPLAY_TRACK="${{ github.event.inputs.track }}"
