name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - closed
          - open
          - production

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare signing and Play credentials
        shell: pwsh
        run: |
          New-Item -Path "guardian/GuardianAndroid/app/keystore" -ItemType Directory -Force | Out-Null
          New-Item -Path "guardian/GuardianAndroid/keys" -ItemType Directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            "guardian/GuardianAndroid/app/keystore/upload-keystore.jks",
            [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          )
          Set-Content -Path "guardian/GuardianAndroid/keys/play-service-account.json" -Value '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' -NoNewline

      - name: Publish AAB to Google Play
        working-directory: guardian/GuardianAndroid
        shell: pwsh
        run: |
          .\gradlew.bat :app:publishReleaseBundle `
            -PRELEASE_STORE_FILE=app/keystore/upload-keystore.jks `
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" `
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}" `
            -PPLAY_SERVICE_ACCOUNT_FILE=keys/play-service-account.json `
            -PPLAY_TRACK="${{ github.event.inputs.track }}"
