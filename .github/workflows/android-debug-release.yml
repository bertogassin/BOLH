name: Android Debug APK Release

on:
  push:
    branches: [main]
    paths:
      - "guardian/GuardianAndroid/**"
  workflow_dispatch:

permissions:
  contents: write   # нужно для создания GitHub Release и загрузки APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        working-directory: guardian/GuardianAndroid
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          DEBUG_WEB_APP_URL: "https://app.omnixius.com/"
          DEBUG_API_BASE_URL: "https://api.omnixius.com"

      - name: Get version info
        id: version
        working-directory: guardian/GuardianAndroid
        run: |
          CODE=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
          NAME=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"' | head -1)
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "tag=android-v${NAME}-${CODE}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv guardian/GuardianAndroid/app/build/outputs/apk/debug/app-debug.apk \
             guardian/GuardianAndroid/app/build/outputs/apk/debug/guardian-debug-${{ steps.version.outputs.name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-${{ steps.version.outputs.name }}
          path: guardian/GuardianAndroid/app/build/outputs/apk/debug/guardian-debug-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Guardian Android ${{ steps.version.outputs.name }}"
          body: |
            Автоматическая APK-сборка Guardian Android.

            **Версия:** `${{ steps.version.outputs.name }}` (build ${{ steps.version.outputs.code }})

            ### Установка на телефон
            1. Скачай файл `guardian-debug-*.apk` ниже.
            2. Открой APK на телефоне — Android попросит разрешить установку из неизвестных источников.
            3. Разреши и установи.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            guardian/GuardianAndroid/app/build/outputs/apk/debug/guardian-debug-${{ steps.version.outputs.name }}.apk
