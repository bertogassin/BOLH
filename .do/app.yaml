name: bolh
region: lon1
domains:
  - domain: app.omnixius.com
    type: PRIMARY
  - domain: api.omnixius.com
    type: ALIAS

services:
  - name: api
    http_port: 8080
    github:
      repo: bertogassin/BOLH
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: guardian/services/api-gateway
    routes:
      - path: /api
      - path: /health
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.omnixius.com,https://www.omnixius.com,https://omnixius.com
        scope: RUN_TIME
      - key: AUTH_COOKIE_DOMAIN
        value: .omnixius.com
        scope: RUN_TIME

  - name: web
    http_port: 3003
    github:
      repo: bertogassin/BOLH
      branch: main
      deploy_on_push: true
    source_dir: guardian/client-web
    build_command: npm ci && npm run build
    run_command: npm run start
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: ${api.PUBLIC_URL}
        scope: RUN_AND_BUILD_TIME
