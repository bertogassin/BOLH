name: bolh
region: lon1
domains:
  - domain: app.omnixius.com
    type: PRIMARY
  - domain: api.omnixius.com
    type: ALIAS

databases:
  - name: db
    engine: PG
    version: "15"
    production: true
  - name: redis
    engine: REDIS
    version: "7"
    production: true

services:
  - name: api
    http_port: 8080
    github:
      repo: bertogassin/BOLH
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: guardian/services/api-gateway
    routes:
      - path: /api
      - path: /health
    envs:
      - key: APP_ENV
        value: production
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: REDIS_ADDR
        value: ${redis.HOSTNAME}:${redis.PORT}
        scope: RUN_TIME
      - key: JWT_SECRET
        value: CHANGE_ME_IN_DO_SECRETS
        scope: RUN_TIME
      - key: ADMIN_SECRET
        value: CHANGE_ME_IN_DO_SECRETS
        scope: RUN_TIME
      - key: APP_BUILD_ID
        value: production
        scope: RUN_TIME
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.omnixius.com,https://www.omnixius.com,https://omnixius.com
        scope: RUN_TIME
      - key: AUTH_COOKIE_DOMAIN
        value: .omnixius.com
        scope: RUN_TIME

  - name: web
    http_port: 3003
    github:
      repo: bertogassin/BOLH
      branch: main
      deploy_on_push: true
    source_dir: guardian/client-web
    build_command: npm ci && npm run build
    run_command: npm run start
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        value: ${api.PUBLIC_URL}
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SIGNED_REQUESTS_ENABLED
        value: "1"
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SIGNED_REQUEST_MODE
        value: partial
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_APP_BUILD_ID
        value: production
        scope: RUN_AND_BUILD_TIME
