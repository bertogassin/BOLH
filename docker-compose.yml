# Guardio - Docker Compose
# Complete stack: PostgreSQL, Redis, Rust Backend, Frontend

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: guardio-postgres
    environment:
      POSTGRES_DB: guardio
      POSTGRES_USER: guardio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guardio_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./guardio-v2/backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guardio-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: guardio-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guardio-network

  # Rust Backend API
  backend:
    build:
      context: ./guardio-v2/backend
      dockerfile: Dockerfile
    container_name: guardio-backend
    environment:
      DATABASE_URL: postgresql://guardio:${DB_PASSWORD:-guardio_secret}@postgres:5432/guardio
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      RUST_LOG: debug,guardio_backend=debug
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - guardio-network

volumes:
  postgres_data:
  redis_data:

networks:
  guardio-network:
    driver: bridge
