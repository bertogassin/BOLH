<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOLH Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --card: #1f2937;
      --accent: #8b5cf6;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, var(--bg) 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(520px, 100%);
      background: rgba(31, 41, 55, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    p {
      margin: 8px 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .chip {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #ddd6fe;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>BOLH Security - Offline</h1>
    <p>Offline mode is active on this device.</p>
    <p>The app remains available locally and will continue when connection returns.</p>
    <span class="chip">Offline mode active</span>
  </main>
</body>
</html>
