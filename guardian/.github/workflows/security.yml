name: Security Scan

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --no-git --redact --no-banner

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo audit
        run: |
          cd guardian
          cargo install cargo-audit
          cargo audit

  web-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [client-web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: guardian/${{ matrix.app }}/package-lock.json
      - name: Audit dependencies
        run: npm --prefix guardian/${{ matrix.app }} ci && npm --prefix guardian/${{ matrix.app }} audit --audit-level=high

  go-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Run govulncheck
        run: |
          cd guardian/services/api-gateway
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  go-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - name: Run gosec
        run: |
          cd guardian/services/api-gateway
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
