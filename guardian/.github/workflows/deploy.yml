name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          cd guardian
          cargo test --workspace --no-fail-fast
          cargo clippy --workspace -- -D warnings
          cargo fmt -- --check

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Test API Gateway
        run: |
          cd guardian/services/api-gateway
          go build ./...
          go vet ./...
          go test ./...

  test-client-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guardian/client-web/package-lock.json
      - name: Install and lint
        run: |
          cd guardian/client-web
          npm ci
          npm run lint
          npm run build

  build-api-gateway:
    needs: [test-rust, test-go, test-client-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api-gateway
        uses: docker/build-push-action@v5
        with:
          context: guardian/services/api-gateway
          file: guardian/services/api-gateway/Dockerfile
          push: false
          tags: guardian/api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-matching:
    needs: [test-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build matching-engine
        uses: docker/build-push-action@v5
        with:
          context: guardian
          file: guardian/services/matching/Dockerfile
          push: false
          tags: guardian/matching-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
