# Пошаговый сценарий ОХРАННИКА
flow:
  - step: "Регистрация"
    emotion: "🤔 Надежда на заработок"
    pain: "Долгая верификация документов"
    solution: "Загрузка фото паспорта, AI-распознавание за секунды"
    microcopy: "Мы проверим документы за минуту"

  - step: "Создание задания (Bid)"
    emotion: "😊 Готовность работать"
    pain: "Не знаю, какую цену ставить"
    solution: "Подсказка: средняя цена по рынку, спрос в этом районе"
    microcopy: "Охранники рядом ставят 1500-1800 ₽/час"

  - step: "Получение уведомления о заказе"
    emotion: "😃 Радость, адреналин"
    pain: "Нужно быстро решать, а информации мало"
    solution: "Push с полной информацией: где, когда, сколько платят"
    microcopy: "🔥 Новый заказ! Центр, сегодня 20:00, 2000 ₽/час"

  - step: "Принятие решения"
    emotion: "🤔 Оценка"
    pain: "Боюсь брать сложные заказы"
    solution: "Детали заказа, требования, особые отметки"
    microcopy: "Требуется оружие (есть у вас) — отлично подходит"

  - step: "Принятие заказа"
    emotion: "😌 Уверенность"
    pain: "Боюсь, что клиент отменит"
    solution: "Подтверждение от клиента + гарантия оплаты"
    microcopy: "Заказ подтвержден! Клиент ждет"

  - step: "Выполнение"
    emotion: "😐 Ответственность"
    pain: "Не знаю, как связаться с клиентом"
    solution: "Чат внутри приложения, кнопка звонка"
    microcopy: "Напишите клиенту за час до начала"

  - step: "Завершение"
    emotion: "😌 Довольство"
    pain: "Долго ждать деньги"
    solution: "Мгновенное зачисление на счет, вывод в любое время"
    microcopy: "2000 ₽ зачислены. Вы можете вывести их сейчас"

  - step: "Получение отзыва"
    emotion: "😊 Гордость"
    pain: "Не знаю, как меня оценили"
    solution: "Уведомление о новом отзыве + рейтинг"
    microcopy: "Клиент поставил 5 звезд! 'Профессионал, спасибо'"
