# Пошаговый сценарий КЛИЕНТА (с эмоциями и микротекстами)
flow:
  - step: "Осознание потребности"
    emotion: "😟 Беспокойство"
    pain: "Нужна охрана, но непонятно где искать"
    solution: "Приложение уже на телефоне, первый экран — создание заказа"
    microcopy: "Кому нужна защита?"

  - step: "Открытие приложения"
    emotion: "🤔 Неуверенность"
    pain: "Сложные формы, непонятно что писать"
    solution: "Один большой шаг вместо 10 маленьких"
    microcopy: "Создайте заказ за минуту"

  - step: "Заполнение деталей"
    emotion: "😐 Озадаченность"
    pain: "Не знаю, какие лицензии нужны"
    solution: "Умные подсказки на основе типа мероприятия"
    microcopy: "Мы подскажем, что нужно"

  - step: "Выбор бюджета"
    emotion: "😬 Страх переплатить"
    pain: "Непонятно, сколько это стоит"
    solution: "Вилка бюджета + средняя цена по рынку"
    microcopy: "Большинство выбирают 1500-2000 ₽/час"

  - step: "Создание заказа"
    emotion: "😊 Надежда"
    pain: "Долгое ожидание"
    solution: "Мгновенное подтверждение + таймер подбора"
    microcopy: "Заказ создан! Ищем лучшего за 2 минуты"

  - step: "Ожидание подбора"
    emotion: "😬 Тревога"
    pain: "Тишина — не найдут?"
    solution: "Анимация поиска, обновление статуса каждые 10 сек"
    microcopy: "Сейчас 3 охранника рассматривают ваш заказ"

  - step: "Найден исполнитель"
    emotion: "😌 Облегчение"
    pain: "Неизвестно, кого прислали"
    solution: "Фото, рейтинг, лицензии — всё сразу видно"
    microcopy: "Иван, рейтинг 4.9, опыт 5 лет"

  - step: "Выполнение заказа"
    emotion: "😊 Спокойствие"
    pain: "Не знаю, где охранник и что делает"
    solution: "Карта с геолокацией в реальном времени"
    microcopy: "Иван на месте. Всё под контролем"

  - step: "Завершение"
    emotion: "😌 Удовлетворение"
    pain: "Нужно платить, опять возня с деньгами"
    solution: "Автосписание, чек на email"
    microcopy: "Спасибо! Вы в безопасности"

  - step: "Оценка"
    emotion: "😊 Благодарность"
    pain: "Лень писать отзывы"
    solution: "Оценка в один клик, быстрый отзыв голосом"
    microcopy: "Как прошло? Оцените в секунду"
