# Пример конфигурации Nginx для балансировки перед API Gateway.
# Upstream с least_conn; лимиты и кэш заголовки.

upstream api_servers {
    least_conn;
    server api1.guardian.internal:8080 max_fails=3 fail_timeout=30s;
    server api2.guardian.internal:8080 max_fails=3 fail_timeout=30s;
    server api3.guardian.internal:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name api.guardian.app;

    ssl_certificate     /etc/nginx/ssl/guardian.crt;
    ssl_certificate_key /etc/nginx/ssl/guardian.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    location /api/v1/ {
        limit_req zone=api burst=200 nodelay;
        limit_conn addr 10;

        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    location /health {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
