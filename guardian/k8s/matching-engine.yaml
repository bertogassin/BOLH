apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: guardian
spec:
  replicas: 3
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: guardian/matching-engine:latest
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: "info"
          envFrom:
            - configMapRef:
                name: guardian-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine-service
  namespace: guardian
spec:
  selector:
    app: matching-engine
  ports:
    - port: 8080
      targetPort: 8080
