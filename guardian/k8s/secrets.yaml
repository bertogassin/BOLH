# Заполнить перед применением: kubectl create secret generic guardian-secrets --from-literal=JWT_SECRET=... -n guardian
apiVersion: v1
kind: Secret
metadata:
  name: guardian-secrets
  namespace: guardian
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  DB_PASSWORD: "change-me"
  ENCRYPTION_KEY: "change-me-32-bytes-base64-encoded"
