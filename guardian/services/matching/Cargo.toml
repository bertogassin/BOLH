[package]
name = "matching"
version = "0.1.0"
edition = "2021"
description = "Guardian Matching Engine - in-memory, microsecond latency"

[[bin]]
name = "matching"
path = "src/main.rs"

[dependencies]
domain = { path = "../../core/domain" }
dashmap = "5.5"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
rust_decimal = "1.43"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4"] }
