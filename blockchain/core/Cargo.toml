[package]
name = "bolh-chain"
version = "0.1.0"
edition = "2021"
description = "BOLH Chain — quantum-resistant, private, modular blockchain"
authors = ["BOLH Team"]

[lib]
crate-type = ["cdylib"]
name = "bolh_core"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto (post-quantum)
sha3 = "0.10"
blake3 = "1"
rand = "0.8"
hex = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
