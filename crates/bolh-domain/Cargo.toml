[package]
name = "bolh-domain"
version = "0.1.0"
edition = "2021"
description = "Core domain entities and value objects for BOLH tenders platform"

[dependencies]
rust_decimal = { version = "1.43", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
