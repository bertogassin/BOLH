[workspace]
resolver = "2"
members = [
    "packages/core",
    "backend",
    "apps/mobile/src-tauri",
    "apps/desktop/src-tauri",
    "blockchain/core", "blockchain/bolh-ffi", "blockchain-service",
    "elina/core",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["BOLH Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono", "rust_decimal", "migrate"] }
rust_decimal = "1.33"

# Redis
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Authentication
jsonwebtoken = "9.2"
argon2 = "0.5"

# Cryptography
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

# Geolocation
geo = "0.27"

# Validation
regex = "1.10"
validator = { version = "0.16", features = ["derive"] }

# Image processing
image = "0.24"
fast_image_resize = "2.7"

# Compression
lz4_flex = "0.11"

# QR Code
qrcode = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenvy = "0.15"

# Tauri
tauri = "2.0"
tauri-build = "2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
